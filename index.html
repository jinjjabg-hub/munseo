<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <!-- 외부 접속 차단(2중 안전장치): 앱 안의 파일만 허용 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>내 문서 뷰어</title>
</head>
<body>
  <div id="app">
    <header id="bar" hidden>
      <div class="bar-title">
        <span id="fname" class="fname"></span>
        <span id="fmeta" class="chip"></span>
      </div>
      <button id="btn-open-top" class="btn" type="button">열기</button>
    </header>
    <div id="tools" hidden>
      <button id="btn-search" class="btn tool" type="button" hidden>🔍 검색</button>
      <button id="btn-save" class="btn tool" type="button" hidden>PDF로 저장</button>
      <button id="btn-share" class="btn tool" type="button" hidden>공유</button>
      <div id="actions"></div>
    </div>
    <div id="findbar" hidden>
      <input id="find-input" type="search" inputmode="search" enterkeyhint="search" placeholder="문서 안에서 찾기" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <span id="find-count" class="find-count" aria-live="polite"></span>
      <button id="find-prev" class="btn tool" type="button" aria-label="이전">▲</button>
      <button id="find-next" class="btn tool" type="button" aria-label="다음">▼</button>
      <button id="find-close" class="btn tool" type="button" aria-label="검색 닫기">✕</button>
    </div>
    <main id="stage">
      <section id="empty" class="center">
        <div class="logo" aria-hidden="true">📄</div>
        <h1>내 문서 뷰어</h1>
        <p class="hint">한글 · 워드 · 엑셀 · 파워포인트 · PDF<br />광고 없이, 인터넷 없이 읽기만 해요.</p>
        <button id="btn-open" class="btn primary big" type="button">파일 열기</button>
        <p class="hint small">파일 앱에서 문서를 탭해도 여기서 바로 열려요.</p>
      </section>
      <section id="loading" class="center" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-text" class="hint">여는 중…</p>
      </section>
      <section id="error" class="center" hidden>
        <div class="logo" aria-hidden="true">⚠️</div>
        <p id="error-text" class="err-text"></p>
        <button id="btn-open-err" class="btn primary" type="button">다른 파일 열기</button>
      </section>
      <div id="viewer" hidden></div>
    </main>
    <input id="picker" type="file" hidden />
  </div>
  <div id="msg" role="status" hidden><span id="msg-text"></span><button id="msg-close" type="button" aria-label="닫기">✕</button></div>
  <!-- PDF로 저장할 때만 내용이 채워지는 인쇄 영역: 앱 화면(#app) 바깥에 둔다 -->
  <div id="print-root" aria-hidden="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
